<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Special Gift For You 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pastel: #ffeef4;
      --bg-gradient: linear-gradient(180deg, #ffeef4 0%, #ffdbe7 100%);
      --primary-pink: #ff6584;
      --deep-pink: #e0446b;
      --soft-pink: #fff0f5;
      --card-bg: rgba(255, 255, 255, 0.92);
      --shadow-color: rgba(230, 100, 135, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #555;
    }

    /* Mobile container frame */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 920px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #ffeef4;
      box-shadow: 0 10px 40px rgba(255, 140, 170, 0.25);
    }

    @media (min-width: 450px) {
      .app-container {
        height: 90vh;
        border-radius: 36px;
        border: 4px solid #fff;
      }
    }

    /* Floating petals canvas */
    canvas#petals {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px 10px;
      z-index: 10;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 182, 193, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }
