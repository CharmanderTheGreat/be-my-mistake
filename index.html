<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A Special Gift For You 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pastel: #ffeef4;
      --bg-gradient: linear-gradient(180deg, #ffeef4 0%, #ffdbe7 100%);
      --primary-pink: #ff6584;
      --deep-pink: #e0446b;
      --soft-pink: #fff0f5;
      --card-bg: rgba(255, 255, 255, 0.92);
      --shadow-color: rgba(230, 100, 135, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #555;
    }

    /* Mobile container frame */
    .app-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 920px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #ffeef4;
      box-shadow: 0 10px 40px rgba(255, 140, 170, 0.25);
    }

    @media (min-width: 450px) {
      .app-container {
        height: 90vh;
        border-radius: 36px;
        border: 4px solid #fff;
      }
    }

    /* Floating petals canvas */
    canvas#petals {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px 10px;
      z-index: 10;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 182, 193, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .badge-pill {
      background: rgba(255, 255, 255, 0.8);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #9c7178;
      border: 1px solid rgba(255, 182, 193, 0.4);
      letter-spacing: 0.5px;
    }

    /* Screen 1: Tap to Unwrap */
    #unwrap-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: pointer;
      transition: opacity 0.6s ease, transform 0.6s ease;
      background: radial-gradient(circle at center, #fff3f7 0%, #ffe0ec 100%);
    }

    #unwrap-screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(1.08);
    }

    .gift-icon-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 24px;
      animation: gentle-float 3s ease-in-out infinite;
    }

    .gift-glow {
      position: absolute;
      inset: -15px;
      background: radial-gradient(circle, rgba(255, 182, 193, 0.7) 0%, rgba(255, 255, 255, 0) 70%);
      border-radius: 50%;
      animation: pulse-glow 2s infinite ease-in-out;
    }

    .gift-svg {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 10px 18px rgba(255, 105, 135, 0.25));
    }

    .gift-heading {
      font-size: 24px;
      font-weight: 800;
      color: #ff477e;
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    .gift-subtext {
      font-size: 12px;
      font-weight: 800;
      color: #b08d96;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse-text 1.6s infinite ease-in-out;
    }

    .tap-indicator {
      margin-top: 26px;
      width: 28px;
      height: 44px;
      border: 2px solid #ff9ebb;
      border-radius: 16px;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .tap-dot {
      width: 6px;
      height: 6px;
      background: #ff477e;
      border-radius: 50%;
      margin-top: 8px;
      animation: scroll-hint 1.8s infinite ease-in-out;
    }

    /* Screen 2: Bouquet Showcase */
    .stage-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
    }

    .bouquet-display {
      position: relative;
      width: 280px;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .bouquet-display.bloom {
      animation: pop-bouquet 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }

    .bouquet-svg-container {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 16px 28px rgba(230, 80, 120, 0.22));
    }

    /* Bottom Toolbar */
    .bottom-bar {
      padding: 12px 20px 24px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 200, 215, 0.5);
      border-radius: 28px 28px 0 0;
      z-index: 10;
    }

    .wrapper-palette-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
      color: #9e7f87;
      text-align: center;
      margin-bottom: 10px;
    }

    .wrapper-choices {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .choice-item {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: #fff;
      border: 2.5px solid transparent;
      box-shadow: 0 4px 12px rgba(255, 180, 195, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 6px;
    }

    .choice-item.active {
      border-color: #ff527b;
      transform: translateY(-4px) scale(1.06);
      box-shadow: 0 8px 18px rgba(255, 82, 123, 0.3);
    }

    /* Floating Letter Notification Button */
    .letter-fab {
      position: absolute;
      right: 22px;
      bottom: 105px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff477e, #ff6b8b);
      box-shadow: 0 8px 22px rgba(255, 71, 126, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 15;
      animation: pulse-fab 2s infinite ease-in-out;
      border: none;
    }

    .letter-fab:active {
      transform: scale(0.92);
    }

    .unread-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background: #ff2a5f;
      color: white;
      font-size: 11px;
      font-weight: 800;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
    }

    /* Confession Letter Modal */
    .letter-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(45, 10, 25, 0.45);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .letter-modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .letter-card {
      width: 100%;
      max-width: 360px;
      max-height: 82vh;
      background: #fff8fa;
      border-radius: 26px;
      padding: 24px 22px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
      position: relative;
      display: flex;
      flex-direction: column;
      border: 2px solid #ffe1ec;
      transform: translateY(30px) scale(0.95);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
